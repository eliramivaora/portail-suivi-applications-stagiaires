{% extends "base.html" %}
{% block content %}
<div class="page-heading page-heading-compact">
  <div>
    <div class="eyebrow">MON COMPTE <span>·</span> SÉCURITÉ</div>
    <h1>Modifier mon mot de passe</h1>
    <p class="page-lede">Choisissez un mot de passe d’au moins 12 caractères.</p>
  </div>
</div>
<form class="record-form user-form" method="post" action="/account/password">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  {% if error %}<div class="form-error form-error-wide" role="alert">{{ error }}</div>{% endif %}
  <fieldset>
    <legend><span class="legend-number">01</span> Vérification du compte</legend>
    <div class="form-grid">
      <div class="field-group field-wide"><label for="current_password">Mot de passe actuel <span class="required-mark">*</span></label><input id="current_password" name="current_password" type="password" autocomplete="current-password" required></div>
      <div class="field-group"><label for="new_password">Nouveau mot de passe <span class="required-mark">*</span></label><input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required><small>12 caractères minimum.</small></div>
      <div class="field-group"><label for="confirm_password">Confirmer le nouveau mot de passe <span class="required-mark">*</span></label><input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div>
    </div>
  </fieldset>
  <div class="form-actions"><p><span class="required-mark">*</span> Champ obligatoire</p><div><a class="button button-quiet" href="/applications">Annuler</a><button class="button button-primary" type="submit">Mettre à jour <span aria-hidden="true">→</span></button></div></div>
</form>
{% endblock %}
